<!DOCTYPE html>
<html lang="en" style="width: 100vw;">
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=Edge">
	<meta charset="UTF-8">
	<meta http-equiv="Cache-Control" content="no-cache">

	<title>qqtt</title>
	<style>
		.loading {
			position: fixed;
			display: block;
			width: 100vw;
			height: 100vh;
			top: 0;
			left: 0;
			overflow: hidden;
			pointer-events: none;
			background: white;
			transition: opacity 400ms ease-in-out, transform 400ms ease;
			z-index: 999;
		}
		.loading::before {
			content: '';
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			width: 65px;
			height: 65px;
			margin: auto;
			position: absolute;
			border: 3px solid rgba(55,55,55,.8);
			border-top: 3px solid #fff;
			border-bottom: 3px solid #fff;
			border-radius: 50%;
			background-color: transparent;
			animation: loading 2s linear infinite;
		}
		.loading::after {
			content: "";
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			width: 80px;
			height: 80px;
			margin: auto;
			position: absolute;
			border: 3px solid rgba(55,55,55,.8);
			border-top: 3px solid #fff;
			border-bottom: 3px solid #fff;
			border-radius: 50%;
			background-color: transparent;
			animation: loading 1.5s linear infinite;
		}
		@keyframes zoom {
			0% {
				transform: translate3d(0, 0, 0) scale(1);
				opacity: 0;
			}
			50% {
				opacity: 0.2;
			}
			100% {
				transform: translate3d(0, 0, 0) scale(10);
				opacity: 0;
			}
		}
		@keyframes rotate {
			from {
				transform: rotate(0deg) scale(1.2) translateZ(0);
			}
			to {
				transform: rotate(360deg) scale(1) translateZ(0);
			}
		}
		@keyframes loading {
			from {
				transform: rotate(0deg);
			}
			to {
				transform: rotate(360deg);
			}
		}
	</style>
</head>
<body>
	<div id="root">
		<div class="loading"></div>
	</div>
<script type="text/javascript" src="/pc/assets/js/vendors.chunk.124a6ca6.js"></script><script type="text/javascript" src="/pc/assets/js/app.bundle.a44facbc.js"></script></body>
</html>
