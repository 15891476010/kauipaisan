<div role="dialog" class="ant-modal-wrap" aria-labelledby="captcha-title">
  <div role="document" class="ant-modal" style="width: 520px">
    <div class="ant-modal-content">
      <button type="button" aria-label="Close" class="ant-modal-close">
        <img src="../assets/svg/close.svg" alt="close">
      </button>
      <div class="ant-modal-header">
        <div class="ant-modal-title" id="captcha-title">请输入图片验证码</div>
      </div>
      <div class="ant-modal-body">
        <div class="captcha-panel show-img">
          <div class="result-wrapper">
            <span class="question-code-wrapper">
              <img src="captcha-sample.jpg" alt="captcha question">
            </span>
            <label>=</label>
            <span class="result-verify-code-wrapper"></span>
            <span class="change-code-button">换题</span>
          </div>
          <div class="code-wrapper">
            <div class="verify-code-wrapper">
              <span class="verify-code num-0">0</span>
              <span class="verify-code num-1">1</span>
              <span class="verify-code num-2">2</span>
              <span class="verify-code num-3">3</span>
              <span class="verify-code num-4">4</span>
              <span class="verify-code num-5">5</span>
              <span class="verify-code num-6">6</span>
              <span class="verify-code num-7">7</span>
              <span class="verify-code num-8">8</span>
              <span class="verify-code num-9">9</span>
            </div>
          </div>
        </div>
      </div>
      <div class="ant-modal-footer">
        <button type="button" class="ant-btn ant-btn-primary">登 录</button>
      </div>
    </div>
  </div>
</div>
